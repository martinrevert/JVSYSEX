name: Release Windows Installer & Binaries

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract SemVer from CMakeLists.txt
        id: version
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -match 'project\(JV1010EditorPro\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            $ver = $Matches[1]
            Write-Output "version=$ver" >> $env:GITHUB_OUTPUT
            Write-Output "APP_VERSION=$ver" >> $env:GITHUB_ENV
            Write-Host "Detected SemVer: $ver"
          } else {
            Write-Error "Could not extract VERSION from CMakeLists.txt"
            exit 1
          }

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build Tests, VST3, and Standalone (Release)
        run: cmake --build build --target JV1010Tests JV1010EditorPro_VST3 JV1010EditorPro_Standalone --config Release

      - name: Run Unit Tests
        run: .\build\Release\JV1010Tests.exe

      - name: Ensure NSIS is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") -and -not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y
          }

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = "C:\Program Files (x86)\NSIS\makensis.exe" }
          & $makensis "/DAPP_VERSION=${{ env.APP_VERSION }}" "installer\JV1010EditorPro.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: JV-1010 Editor Pro v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            build/JV-1010-Editor-Pro-${{ steps.version.outputs.version }}-Windows-x64-Setup.exe
